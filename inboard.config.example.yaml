# inboard configuration — everything personal lives here; nothing is hardcoded in the code.
# `inboard init` generates a real inboard.config.yaml from this template. Copy + edit by hand too.

identity:
  name: "Your Name"                 # how the agent addresses you and signs drafts
  timezone: "America/New_York"

# One entry per mailbox the agent watches. `id` is a stable key used internally (board's
# Account value, mail-images, prompts); `label` is what shows on the board.
accounts:
  - id: personal
    label: "Personal"
    provider: gmail
    address: "you@gmail.com"
    calendar: true
    gws_config_dir: ""              # blank = the default gws config; set a path to isolate a 2nd account
    gws_keyring_backend: ""         # blank = default; e.g. "file" for a headless/second account
  - id: work
    label: "Work"
    provider: gmail
    address: "you@org.edu"
    calendar: false
    gws_config_dir: "~/.config/gws-work"
    gws_keyring_backend: "file"

board:
  provider: notion
  database_id: ""                   # filled by `inboard init` (the kanban DB it creates)
  daily_log_database_id: ""         # optional FYI/audit log DB; blank = disabled
  token_env: NOTION_TOKEN           # env var holding the Notion integration token (kept in .env, gitignored)
  bot_user_id: ""                   # this integration's Notion user id (filled by init; used for self-echo dedup)
  webhook_port: 8787                # local port the webhook server listens on

  # Board vocabulary — the DISPLAY strings inboard reads/writes. Defaults are English (shown here). To drive
  # an EXISTING board in another language, set these to that board's actual values (the KEYS stay fixed).
  # The agent always writes the English canonical names; the board CLI translates them to these on write.
  schema:
    status:                         # Status select values, by role
      new: "📥 New"
      researching: "🔍 Researching"
      draft: "✍️ Draft ready"
      awaiting: "⏳ Awaiting reply"
      needs_you: ⏸ Needs you        # his move; New is mail nobody has worked yet
      done: "✅ Done"
      expired: "⌛ Expired"
      unsub: "🚫 Unsubscribed"
    action_placeholder: "👉 Pick action"
    send_action: 📤 Send it for me
    actions:                        # tappable Action chips (created only on a fresh board)
      - "▶️ Continue / redo"
      - "📤 Sent — awaiting reply"
      - "✅ Done / ignore"
    daily_types:                    # daily-log Type select values, by role
      unsub: "🚫 Unsubscribe"
      done: "✅ Done"
      draft: "✉️ Draft"
      fyi: "ℹ️ FYI"
      sent: "📤 Sent"
    daily_props:                    # daily-log PROPERTY names (Notion never auto-creates properties → must match the DB)
      item: "Item"
      date: "Date"
      type: "Type"
      account: "Account"
      detail: "Detail"

schedule:
  pull_interval_seconds: 300        # how often the pull loop runs
  stale_awaiting_days: 3            # a sent-but-unanswered card older than this gets surfaced for follow-up

agent:
  model: sonnet
  delivery: inprocess              # inprocess = one claude -p per event (default). daemon = queue each
                                    # event to the card's persistent daemon-hosted agent via the
                                    # control socket (lib/agent_deliver.py) — no dropped taps under
                                    # contention, but needs a token-carrying Claude Code daemon running.
                     # Claude Code model for both engines (e.g. sonnet | opus)
  pull_max_turns: 80                # tool-call budget for one pull-loop cycle
  interactive_max_turns: 45         # tool-call budget for a webhook (comment/action) run
  dispatch: false                   # false = one session per batch (engine 1);
                                    # true  = engine 1b: a dispatcher groups the batch by matter
                                    #         from headers, then one agent per matter reads only
                                    #         its own bodies (see DESIGN.md 'Engine 1b')
  dispatch_max_turns: 30            # the dispatcher only lists and groups; it never opens a body
  card_max_turns: 45                # one matter's agent
  dispatch_parallel: 4              # concurrent card agents
  session_handover_pct: 65          # hand a card's session over once its last turn used this share of
                                    # the context window. Measured from the transcript's own usage record,
                                    # which is what the next turn re-sends — a 19 MB transcript sat at 61%
                                    # because compaction had already dropped most of it, while a 10 MB one
                                    # was at 100%. Long-horizon agent systems converge on syncing state out
                                    # around this point, while there is still room to do it coherently.
  context_window: 200000            # tokens; what the percentage above is a share of
  session_rotate_kb: 256            # FALLBACK only, for a session with no usable usage record yet.
                                    # Sized from 505 working sessions: a fresh agent costs ~60k context
                                    # tokens whatever it does (standing orders + tools + the card), and
                                    # transcripts peak at ~14k context under 64 KB, ~83k at 64-256 KB,
                                    # ~112k at 256 KB-1 MB, ~269k past 1 MB. 256 KB is where a session
                                    # starts carrying real weight above that floor; the old 1 MB only
                                    # fired at ~4x it. The card and its state note carry the matter, so
                                    # only working memory is lost (see DESIGN.md 'State model')

network:
  https_proxy: ""                   # optional; e.g. "http://127.0.0.1:7897" — blank = direct

preferences:                        # user-editable DEFAULTS; nuanced/learned prefs live in the memory backend
  identity_alerts: assume-self      # "was this you?" mail (new sign-in, app authorized,
                                    # password reset): assume it was the operator and log it.
                                    # Escalate only when the sender reports a bad OUTCOME.
  calendar_events: propose          # propose | auto | off  (propose = draft the event on the card, add on your OK)
  ci_notifications: noise           # noise | surface       (CI/build-failure emails)
  unsubscribe: conservative         # conservative | aggressive

secrets:
  backend: cred                     # cred | env | keychain  (external broker; see docs)

memory:
  backend: file                     # file | omem | none   (file = zero-setup default)
  path: "~/.local/share/inboard/memory"   # used when backend: file
